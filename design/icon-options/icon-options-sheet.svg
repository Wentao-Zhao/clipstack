<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="frameGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7a3ab"/>
      <stop offset="36%" stop-color="#adbf9f"/>
      <stop offset="72%" stop-color="#9eb5ca"/>
      <stop offset="100%" stop-color="#d4bd99"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2933" flood-opacity="0.10"/>
    </filter>
    <style>
      .sheet { fill: #f2f2f0; }
      .card { fill: rgba(255,255,255,0.66); }
      .icon-bg { fill: #f7f7f5; }
      .app-base { fill: #f2f2f0; }
      .body-fill { fill: none; stroke: url(#frameGradient); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .clip { fill: #9fb5a8; }
      .line-red { stroke: #c28f9e; }
      .line-green { stroke: #9eb896; }
      .line-blue { stroke: #94adc4; }
      .line-yellow { stroke: #d1b88f; }
      .line { stroke-width: 7; stroke-linecap: round; }
      .label { fill: #3a3d42; font: 600 28px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; text-anchor: middle; }
      .sub { fill: rgba(70,73,78,0.72); font: 400 17px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sheet" width="1600" height="520"/>

  <!-- A -->
  <g transform="translate(40,40)">
    <rect class="card" x="0" y="0" width="280" height="410" rx="34" filter="url(#softShadow)"/>
    <g transform="translate(60,58)">
      <rect class="app-base" x="0" y="0" width="160" height="160" rx="36"/>
      <rect class="icon-bg" x="4" y="4" width="152" height="152" rx="32"/>
      <rect class="body-fill" x="43" y="31" width="74" height="100" rx="14"/>
      <rect class="clip" x="62" y="21" width="36" height="20" rx="8"/>
      <line class="line line-red" x1="62" y1="66" x2="98" y2="66"/>
      <line class="line line-green" x1="62" y1="84" x2="98" y2="84"/>
      <line class="line line-blue" x1="62" y1="102" x2="98" y2="102"/>
      <line class="line line-yellow" x1="62" y1="120" x2="98" y2="120"/>
    </g>
    <text class="label" x="140" y="302">A. 剪贴记</text>
    <text class="sub" x="140" y="334">当前结构精修版</text>
    <text class="sub" x="140" y="365">最稳妥, 识别清晰</text>
  </g>

  <!-- B -->
  <g transform="translate(350,40)">
    <rect class="card" x="0" y="0" width="280" height="410" rx="34" filter="url(#softShadow)"/>
    <g transform="translate(60,58)">
      <rect class="app-base" x="0" y="0" width="160" height="160" rx="36"/>
      <rect class="icon-bg" x="4" y="4" width="152" height="152" rx="32"/>
      <rect x="37" y="45" width="70" height="88" rx="14" fill="#e1d2cf" stroke="#c7a3ab" stroke-width="3" opacity="0.70"/>
      <rect x="50" y="37" width="70" height="92" rx="14" fill="#d7e0d1" stroke="#9eb896" stroke-width="3" opacity="0.78"/>
      <rect class="body-fill" x="58" y="40" width="68" height="90" rx="14"/>
      <rect class="clip" x="74" y="31" width="34" height="18" rx="8"/>
      <line class="line line-red" x1="75" y1="72" x2="106" y2="72"/>
      <line class="line line-green" x1="75" y1="90" x2="106" y2="90"/>
      <line class="line line-blue" x1="75" y1="108" x2="106" y2="108"/>
    </g>
    <text class="label" x="140" y="302">B. 剪存</text>
    <text class="sub" x="140" y="334">多页历史感</text>
    <text class="sub" x="140" y="365">更像历史剪贴板</text>
  </g>

  <!-- C -->
  <g transform="translate(660,40)">
    <rect class="card" x="0" y="0" width="280" height="410" rx="34" filter="url(#softShadow)"/>
    <g transform="translate(60,58)">
      <rect class="app-base" x="0" y="0" width="160" height="160" rx="36"/>
      <rect class="icon-bg" x="4" y="4" width="152" height="152" rx="32"/>
      <rect class="body-fill" x="40" y="30" width="80" height="102" rx="14"/>
      <rect class="clip" x="63" y="21" width="34" height="18" rx="8"/>
      <rect x="55" y="61" width="50" height="10" rx="5" fill="#c28f9e"/>
      <rect x="55" y="83" width="50" height="10" rx="5" fill="#9eb896"/>
      <rect x="55" y="105" width="50" height="10" rx="5" fill="#94adc4"/>
    </g>
    <text class="label" x="140" y="302">C. 剪贴簿</text>
    <text class="sub" x="140" y="334">便签卡片感</text>
    <text class="sub" x="140" y="365">更柔和, 更 Apple</text>
  </g>

  <!-- D -->
  <g transform="translate(970,40)">
    <rect class="card" x="0" y="0" width="280" height="410" rx="34" filter="url(#softShadow)"/>
    <g transform="translate(60,58)">
      <rect class="app-base" x="0" y="0" width="160" height="160" rx="36"/>
      <rect class="icon-bg" x="4" y="4" width="152" height="152" rx="32"/>
      <rect class="body-fill" x="43" y="31" width="74" height="100" rx="14"/>
      <rect class="clip" x="62" y="21" width="36" height="20" rx="8"/>
      <line class="line line-red" x1="61" y1="67" x2="94" y2="67"/>
      <line class="line line-green" x1="61" y1="85" x2="94" y2="85"/>
      <line class="line line-blue" x1="61" y1="103" x2="94" y2="103"/>
      <line class="line line-yellow" x1="61" y1="121" x2="94" y2="121"/>
      <rect x="92" y="114" width="18" height="18" rx="9" fill="#d1b88f"/>
      <circle cx="101" cy="123" r="4" fill="#f7f7f5"/>
    </g>
    <text class="label" x="140" y="302">D. 剪忆</text>
    <text class="sub" x="140" y="334">轻量时间感</text>
    <text class="sub" x="140" y="365">更短, 记忆点强</text>
  </g>

  <!-- E -->
  <g transform="translate(1280,40)">
    <rect class="card" x="0" y="0" width="280" height="410" rx="34" filter="url(#softShadow)"/>
    <g transform="translate(60,58)">
      <rect class="app-base" x="0" y="0" width="160" height="160" rx="36"/>
      <rect class="icon-bg" x="4" y="4" width="152" height="152" rx="32"/>
      <rect class="body-fill" x="42" y="31" width="76" height="100" rx="14"/>
      <rect class="clip" x="62" y="21" width="36" height="20" rx="8"/>
      <line class="line line-red" x1="62" y1="66" x2="98" y2="66"/>
      <line class="line line-green" x1="62" y1="84" x2="98" y2="84"/>
      <line class="line line-blue" x1="62" y1="102" x2="98" y2="102"/>
      <line class="line line-yellow" x1="62" y1="120" x2="98" y2="120"/>
      <circle cx="48" cy="66" r="5" fill="#c28f9e"/>
      <circle cx="112" cy="84" r="5" fill="#9eb896"/>
      <circle cx="48" cy="102" r="5" fill="#94adc4"/>
      <circle cx="112" cy="120" r="5" fill="#d1b88f"/>
    </g>
    <text class="label" x="140" y="302">E. 剪贴流</text>
    <text class="sub" x="140" y="334">内容流动感</text>
    <text class="sub" x="140" y="365">稍活泼, 功能感强</text>
  </g>
</svg>
