<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520">
  <defs>
    <linearGradient id="frameGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7a3ab"/>
      <stop offset="36%" stop-color="#adbf9f"/>
      <stop offset="72%" stop-color="#9eb5ca"/>
      <stop offset="100%" stop-color="#d4bd99"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2933" flood-opacity="0.10"/>
    </filter>
    <style>
      .sheet { fill: #f2f2f0; }
      .card { fill: rgba(255,255,255,0.66); }
      .app-base { fill: #f2f2f0; }
      .icon-bg { fill: #f7f7f5; }
      .front { fill: none; stroke: url(#frameGradient); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .echo-red { fill: none; stroke: #c7a3ab; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.32; }
      .echo-green { fill: none; stroke: #adbf9f; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.34; }
      .echo-blue { fill: none; stroke: #9eb5ca; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.32; }
      .fill-red { fill: #e7d9dc; opacity: 0.62; }
      .fill-green { fill: #dce5d7; opacity: 0.64; }
      .fill-blue { fill: #d8e2ea; opacity: 0.60; }
      .clip { fill: #9fb5a8; }
      .line { stroke-width: 7; stroke-linecap: round; }
      .red { stroke: #c28f9e; }
      .green { stroke: #9eb896; }
      .blue { stroke: #94adc4; }
      .yellow { stroke: #d1b88f; }
      .label { fill: #3a3d42; font: 600 26px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; text-anchor: middle; }
      .sub { fill: rgba(70,73,78,0.72); font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sheet" width="1320" height="520"/>

  <!-- B1: abstract echo frames -->
  <g transform="translate(40,40)">
    <rect class="card" x="0" y="0" width="290" height="410" rx="34" filter="url(#softShadow)"/>
    <g transform="translate(65,58)">
      <rect class="app-base" x="0" y="0" width="160" height="160" rx="36"/>
      <rect class="icon-bg" x="4" y="4" width="152" height="152" rx="32"/>
      <rect class="echo-red" x="36" y="45" width="70" height="88" rx="14"/>
      <rect class="echo-green" x="45" y="38" width="70" height="92" rx="14"/>
      <rect class="front" x="54" y="31" width="70" height="100" rx="14"/>
      <rect class="clip" x="72" y="22" width="34" height="19" rx="8"/>
      <line class="line red" x1="72" y1="67" x2="105" y2="67"/>
      <line class="line green" x1="72" y1="85" x2="105" y2="85"/>
      <line class="line blue" x1="72" y1="103" x2="105" y2="103"/>
      <line class="line yellow" x1="72" y1="121" x2="105" y2="121"/>
    </g>
    <text class="label" x="145" y="302">B1</text>
    <text class="sub" x="145" y="334">回声轮廓</text>
    <text class="sub" x="145" y="365">历史感明显, 细节最少</text>
  </g>

  <!-- B2: soft stacked surfaces -->
  <g transform="translate(365,40)">
    <rect class="card" x="0" y="0" width="290" height="410" rx="34" filter="url(#softShadow)"/>
    <g transform="translate(65,58)">
      <rect class="app-base" x="0" y="0" width="160" height="160" rx="36"/>
      <rect class="icon-bg" x="4" y="4" width="152" height="152" rx="32"/>
      <rect class="fill-red" x="34" y="49" width="72" height="82" rx="15"/>
      <rect class="fill-green" x="45" y="41" width="72" height="88" rx="15"/>
      <rect class="front" x="56" y="32" width="68" height="98" rx="14"/>
      <rect class="clip" x="73" y="23" width="34" height="18" rx="8"/>
      <line class="line red" x1="73" y1="69" x2="106" y2="69"/>
      <line class="line green" x1="73" y1="88" x2="106" y2="88"/>
      <line class="line blue" x1="73" y1="107" x2="106" y2="107"/>
    </g>
    <text class="label" x="145" y="302">B2</text>
    <text class="sub" x="145" y="334">柔和背板</text>
    <text class="sub" x="145" y="365">更圆润, 更像系统图标</text>
  </g>

  <!-- B3: left-edge layered memory -->
  <g transform="translate(690,40)">
    <rect class="card" x="0" y="0" width="290" height="410" rx="34" filter="url(#softShadow)"/>
    <g transform="translate(65,58)">
      <rect class="app-base" x="0" y="0" width="160" height="160" rx="36"/>
      <rect class="icon-bg" x="4" y="4" width="152" height="152" rx="32"/>
      <path class="echo-blue" d="M45 49 H102 Q113 49 113 60 V121 Q113 132 102 132 H45"/>
      <path class="echo-green" d="M52 40 H111 Q122 40 122 51 V122 Q122 133 111 133 H52"/>
      <rect class="front" x="58" y="31" width="68" height="100" rx="14"/>
      <rect class="clip" x="75" y="22" width="34" height="19" rx="8"/>
      <line class="line red" x1="75" y1="67" x2="108" y2="67"/>
      <line class="line green" x1="75" y1="85" x2="108" y2="85"/>
      <line class="line blue" x1="75" y1="103" x2="108" y2="103"/>
      <line class="line yellow" x1="75" y1="121" x2="108" y2="121"/>
    </g>
    <text class="label" x="145" y="302">B3</text>
    <text class="sub" x="145" y="334">侧边层叠</text>
    <text class="sub" x="145" y="365">抽象但方向感更强</text>
  </g>

  <!-- B4: minimal history badge -->
  <g transform="translate(1015,40)">
    <rect class="card" x="0" y="0" width="290" height="410" rx="34" filter="url(#softShadow)"/>
    <g transform="translate(65,58)">
      <rect class="app-base" x="0" y="0" width="160" height="160" rx="36"/>
      <rect class="icon-bg" x="4" y="4" width="152" height="152" rx="32"/>
      <rect class="echo-red" x="43" y="39" width="70" height="92" rx="14"/>
      <rect class="front" x="50" y="31" width="72" height="100" rx="14"/>
      <rect class="clip" x="69" y="22" width="34" height="19" rx="8"/>
      <line class="line red" x1="69" y1="67" x2="101" y2="67"/>
      <line class="line green" x1="69" y1="85" x2="101" y2="85"/>
      <line class="line blue" x1="69" y1="103" x2="101" y2="103"/>
      <circle cx="113" cy="121" r="10" fill="#d1b88f"/>
      <circle cx="113" cy="121" r="4" fill="#f7f7f5"/>
    </g>
    <text class="label" x="145" y="302">B4</text>
    <text class="sub" x="145" y="334">极简历史点</text>
    <text class="sub" x="145" y="365">最简洁, 功能暗示较弱</text>
  </g>
</svg>
